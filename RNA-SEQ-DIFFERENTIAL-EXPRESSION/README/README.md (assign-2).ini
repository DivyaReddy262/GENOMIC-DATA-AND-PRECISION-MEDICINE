1. Project Overview: This analysis investigates host miRNA expression changes in response to SARS-CoV-2 infection using publicly available small RNA-seq datasets.

The workflow includes:
- Downloading SRA data
- Converting SRA to FASTQ
- Trimming reads
- Building Bowtie miRNA index
- Aligning reads to miRNA reference
- Generating sorted BAM files
- Quantifying miRNA expression
- Differential expression analysis
- GO enrichment 
- Exporting final results (Excel files)
All outputs are provided in .xlsx format as required.

2. Folder Structure:
cov2_mirna/
│── fastq/                     # raw SRA FASTQ files
│── trimmed/                   # trimmed reads (Cutadapt output)
│── reference/                 # miRBase mature.fa & hairpin.fa
│── bowtie_index/              # Bowtie1 miRNA index
│── bowtie_align/              # SAM alignment files
│── bam_mirna/                 # sorted BAM files
│── counts/                    # read count files
│── DEG/                       # Differential expression results
│── GO_Enrichment/             # GO enrichment tables

3. Modules Loaded:
module load python
module load cutadapt
module load bowtie/1.3.1
module load samtools
module load subread

4. Download FASTQ Files:
Raw FASTQ files stored in fastq/
Basic command used: fastq-dump <SRA_ID>

5.Trim Adapters (Cutadapt)
Trimmed reads saved in trimmed/
Basic command: cutadapt -a <adapter> -o output.fastq input.fastq

6.Prepare miRNA Reference Files
Mature miRNA sequences stored in:
reference/mature.fa
Basic command: bowtie-build reference.fa index_name

7. Align Reads to miRNAs (Bowtie1)
Output SAM files located in bowtie_align/
Basic command: bowtie index read.fastq output.sam

8. Convert SAM to BAM (Samtools)
Sorted BAMs stored in bam_mirna/
Basic workflow:
samtools view
samtools sort
samtools index

9.Count miRNA Reads (featureCounts)
Read count table saved as: counts/mirna_counts.txt

Basic command:featureCounts -a annotation.gtf -o counts.txt *.bam

10. Differential Expression (DESeq2 — R)

DE files saved as:
DEG_Comparison1_*.xlsx
DEG_Comparison2_*.xlsx

Basic R code:
dds <- DESeqDataSetFromMatrix(counts, meta, design=~Condition)
dds <- DESeq(dds)
res <- results(dds)

11. GO Enrichment (clusterProfiler — R)
GO files saved under GO_Enrichment/
Basic R code: ego <- enrichGO(gene=sig_genes, OrgDb=org.Hs.eg.db, ont="BP")

12. Final Output files

- DEG_Comparison1_Mock_vs_SARS-CoV-2.xlsx
- DEG_Comparison2_SARS-CoV-2_24H_vs_72H.xlsx
- expression_levels.xlsx
- GO enrichment Excel sheets 

13. Interpretation Summary:

Differential Expression:
- Identifies host miRNAs significantly altered upon SARS-CoV-2 infection.
- Comparison 1 reveals infection-specific alterations.
- Comparison 2 reveals time-dependent progression (24h vs 72h).

GO Enrichment:
- Highlighted immune response, viral defense, cytokine signaling.
- Upregulated miRNAs enriched in antiviral pathways.
- Downregulated miRNAs associated with cell cycle & transcriptional regulation.